<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one section per screen, big tap targets, sticky Back/Next bar, final review screen that sends answers to WhatsApp. */
:root{
  --bg:#EEF2F1; --card:#FFFFFF; --ink:#11201E; --muted:#51635F; --line:#C5D2CF;
  --accent:#0B6B63; --on-accent:#FFFFFF; --soft:#E3EEEC; --chip-on:#0B6B63;
  --f-blue:#2F6FDB; --f-white:#F2F2EC; --f-red:#D63B2F; --f-green:#2E9B5A; --f-yellow:#F2B52C;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1615; --card:#152322; --ink:#E6EFEC; --muted:#9DB1AC; --line:#2C403D;
    --accent:#3DC2B3; --on-accent:#04201D; --soft:#1C302E; --chip-on:#3DC2B3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1615; --card:#152322; --ink:#E6EFEC; --muted:#9DB1AC; --line:#2C403D;
  --accent:#3DC2B3; --on-accent:#04201D; --soft:#1C302E; --chip-on:#3DC2B3;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 17px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 12px;
}
.wrap{max-width:640px;margin:0 auto;min-width:0}
.flags{height:6px;margin-top:10px;border-radius:3px;
  background:linear-gradient(90deg,var(--f-blue) 0 20%,var(--f-white) 0 40%,var(--f-red) 0 60%,var(--f-green) 0 80%,var(--f-yellow) 0 100%)}
header{padding:18px 0 14px;display:grid;gap:10px}
h1{font:700 30px/1.1 var(--display);margin:0;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:16px}
.jump{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.jump select{flex:1;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:grid;gap:26px;min-width:0}
.panel>div,.panel>fieldset{min-width:0}
h2{font:700 24px/1.15 var(--display);margin:0;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);font-size:16px}
.q{display:grid;gap:8px;border:0;padding:0;margin:0}
.ql{font-weight:600;font-size:17px;padding:0;margin:0}
.hint{margin:0;color:var(--muted);font-size:15px}
input[type=text],textarea,select{
  width:100%;font:400 16px/1.4 var(--body);color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;
}
textarea{resize:vertical;min-height:96px}
select{padding-right:8px}
input:focus-visible,textarea:focus-visible,select:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;
  border:1.5px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:16px;line-height:1.25}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--on-accent);font-weight:600}
.chip:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.rows{display:grid;gap:12px}
.row{background:var(--soft);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row h3{grid-column:1/-1;margin:0;font:600 15px var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.f{display:grid;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f span{font-size:14px;color:var(--muted)}
.note{margin:0;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:15px;border-left:4px solid var(--f-yellow)}
.btn{font:600 16px var(--body);min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--accent);
  background:var(--accent);color:var(--on-accent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.big{min-height:56px;font-size:18px;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.nav{position:sticky;bottom:0;margin-top:18px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav .count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.out{width:100%;min-height:260px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
.actions{display:grid;gap:10px}
#msg{margin:0;min-height:1.5em;font-size:15px;color:var(--muted)}
.link{background:none;border:0;padding:8px 0;font:inherit;font-size:15px;color:var(--muted);text-decoration:underline;cursor:pointer;justify-self:start}
@media (max-width:480px){.row{grid-template-columns:1fr}.f{grid-column:1/-1}}
</style>

const REVIEW = SECTIONS.length;
let S = { a:{}, step:0 };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p.a === "object" && p.a) S = { a:p.a, step:+p.step||0 }; }
} catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}

function qText(q){
  const id = "q-" + q.id;
  const f = q.t === "long"
    ? h("textarea", { id, rows:3, placeholder:q.ph || "" })
    : h("input", { id, type:"text", placeholder:q.ph || "", inputmode:q.im || "text", autocomplete:"off" });
  f.value = S.a[q.id] || "";
  f.addEventListener("input", () => { S.a[q.id] = f.value; changed(); });
  return h("div", { class:"q" }, h("label", { for:id, class:"ql", text:q.q }), q.hint ? h("p", { class:"hint", text:q.hint }) : null, f);
}

function qChoice(q){
  const many = q.t === "many";
  const items = q.opts.map((o, i) => {
    const inp = h("input", { type: many ? "checkbox" : "radio", name:"q-" + q.id, value:o });
    const lab = h("label", { class:"chip" }, inp, h("span", { text:o }));
    return { o, inp, lab };
  });
  function sync(){
    const cur = S.a[q.id];
    items.forEach(it => {
      const on = many ? Array.isArray(cur) && cur.includes(it.o) : cur === it.o;
      it.inp.checked = on;
      it.lab.classList.toggle("on", on);
    });
  }
  items.forEach(it => {
    if (many) it.inp.addEventListener("change", () => {
      S.a[q.id] = items.filter(x => x.inp.checked).map(x => x.o);
      sync(); changed();
    });
    else it.inp.addEventListener("click", () => {
      S.a[q.id] = S.a[q.id] === it.o ? "" : it.o;
      sync(); changed();
    });
  });
  sync();
  return h("fieldset", { class:"q" },
    h("legend", { class:"ql", text:q.q }),
    q.hint ? h("p", { class:"hint", text:q.hint }) : null,
    h("div", { class:"chips" }, items.map(it => it.lab)));
}

function qGroup(q){
  const saved = Array.isArray(S.a[q.id]) ? S.a[q.id] : [];
  const n = Math.max(q.rows, saved.length);
  S.a[q.id] = Array.from({ length:n }, (_, i) => saved[i] && typeof saved[i] === "object" ? saved[i] : {});
  const list = h("div", { class:"rows" });
  function buildRow(i){
    const preset = q.preset && q.preset[i];
    const row = h("div", { class:"row" }, h("h3", { text: preset || q.item + " " + (i + 1) }));
    q.fields.forEach(f => {
      if (preset && f.k === "model") return;
      const id = `q-${q.id}-${i}-${f.k}`;
      const inp = f.t === "long"
        ? h("textarea", { id, rows:3, placeholder:f.ph || "" })
        : h("input", { id, type:"text", placeholder:f.ph || "", inputmode:f.im || "text", autocomplete:"off" });
      inp.value = S.a[q.id][i][f.k] || "";
      inp.addEventListener("input", () => { S.a[q.id][i][f.k] = inp.value; changed(); });
      row.append(h("label", { class:"f" + (f.w === "full" ? " full" : ""), for:id }, h("span", { text:f.l }), inp));
    });
    return row;
  }
  for (let i = 0; i < n; i++) list.append(buildRow(i));
  return h("div", { class:"q" },
    h("p", { class:"ql", text:q.q }),
    q.hint ? h("p", { class:"hint", text:q.hint }) : null,
    list,
    h("button", { type:"button", class:"btn ghost", text:q.add, onclick(){
      S.a[q.id].push({});
      list.append(buildRow(S.a[q.id].length - 1));
      changed();
    }}));
}

function buildQ(q){
  if (q.t === "note") return h("p", { class:"note", text:q.q });
  if (q.t === "one" || q.t === "many") return qChoice(q);
  if (q.t === "group") return qGroup(q);
  return qText(q);
}

function isFilled(q){
  const v = S.a[q.id];
  if (q.t === "group") return Array.isArray(v) && v.some(r => Object.values(r).some(x => String(x).trim() !== ""));
  if (Array.isArray(v)) return v.length > 0;
  return typeof v === "string" && v.trim() !== "";
}
const allQs = SECTIONS.flatMap(s => s.qs.filter(q => q.t !== "note"));

const stage = document.getElementById("stage");
const panels = SECTIONS.map((s, i) => {
  const p = h("section", { class:"panel", hidden:true },
    h("div", null, h("h2", { text:s.title }), h("p", { class:"lead", text:s.lead })),
    s.qs.map(buildQ));
  stage.append(p);
  return p;
});
const review = h("section", { class:"panel", hidden:true });
stage.append(review);

const jump = document.getElementById("jump");
SECTIONS.forEach((s, i) => jump.append(h("option", { value:i, text:`${i + 1}. ${s.title}` })));
jump.append(h("option", { value:REVIEW, text:"Check and send" }));
jump.addEventListener("change", () => go(+jump.value));

function summary(){
  const d = new Date().toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
  const lines = ["*A1 Motorbike Rental & Tours: website answers*", d, ""];
  let any = false;
  SECTIONS.forEach((s, i) => {
    const out = [];
    s.qs.forEach(q => {
      if (q.t === "note") return;
      const v = S.a[q.id];
      if (q.t === "group") {
        (v || []).forEach((r, n) => {
          const parts = q.fields.filter(f => r[f.k] && String(r[f.k]).trim()).map(f => `${f.l}: ${String(r[f.k]).trim()}`);
          if (parts.length) out.push(`${q.preset && q.preset[n] ? q.preset[n] : q.item + " " + (n + 1)}: ${parts.join(" | ")}`);
        });
      } else if (Array.isArray(v)) {
        if (v.length) out.push(`${q.s}: ${v.join(", ")}`);
      } else if (typeof v === "string" && v.trim()) {
        out.push(`${q.s}: ${v.trim()}`);
      }
    });
    if (out.length) { any = true; lines.push(`*${i + 1}. ${s.title}*`, ...out, ""); }
  });
  return { text:lines.join("\n").trim(), any };
}

function waHref(text){
  const base = SEND_TO ? `https://wa.me/${SEND_TO}` : "https://wa.me/";
  const tooLong = encodeURIComponent(text).length > 4500;
  const t = tooLong ? "Hello, here are my website answers. They are long, so I am pasting them in the next message." : text;
  return { href:`${base}?text=${encodeURIComponent(t)}`, tooLong };
}

function renderReview(){
  const { text, any } = summary();
  const wa = waHref(text);
  const out = h("textarea", { class:"out", readonly:true, "aria-label":"Your answers", value:"" });
  out.value = any ? text : "No answers yet. Go back and fill in what you can.";
  const msg = h("p", { id:"msg", role:"status", "aria-live":"polite" });
  function copy(){
    if (!any) return;
    const ok = () => { msg.textContent = "Copied. Now paste it in the WhatsApp chat."; };
    const fail = () => { out.focus(); out.select(); msg.textContent = "Press and hold the text, then tap Copy."; };
    try { navigator.clipboard.writeText(text).then(ok, fail); } catch (e) { fail(); }
  }
  const send = h("a", { class:"btn big", href:wa.href, target:"_blank", rel:"noopener", text:"Send answers on WhatsApp" });
  if (!any) { send.setAttribute("aria-disabled", "true"); send.style.opacity = ".4"; send.style.pointerEvents = "none"; }
  send.addEventListener("click", () => {
    if (!any) return;
    try { navigator.clipboard.writeText(text).catch(() => {}); } catch (e) {}
    msg.textContent = wa.tooLong
      ? "Your answers are long. They are copied: paste them in the chat after WhatsApp opens, then press send."
      : "WhatsApp is opening. Choose the chat and press send.";
  });
  let armed = false, timer = 0;
  const clear = h("button", { type:"button", class:"link", text:"Erase all my answers", onclick(){
    if (!armed) { armed = true; clear.textContent = "Tap again to erase everything"; timer = setTimeout(() => { armed = false; clear.textContent = "Erase all my answers"; }, 4000); return; }
    clearTimeout(timer);
    S = { a:{}, step:0 }; save(); location.reload();
  }});
  review.replaceChildren(
    h("div", null, h("h2", { text:"Check and send" }), h("p", { class:"lead", text:"Read your answers below. If something is missing, tap Back or use Go to at the top. Then send." })),
    out,
    h("div", { class:"actions" }, send, h("button", { type:"button", class:"btn ghost big", text:"Copy answers", onclick:copy }), msg),
    h("p", { class:"note", text:"Photos, logo and voice notes: send them separately on WhatsApp. Choose Document for full quality." }),
    clear);
}

function updateMeta(){
  const n = allQs.filter(isFilled).length;
  document.getElementById("answered").textContent = `${n} of ${allQs.length} answered`;
}
function changed(){ save(); updateMeta(); }

const back = document.getElementById("back"), next = document.getElementById("next");
function go(i){
  S.step = Math.max(0, Math.min(REVIEW, i));
  panels.forEach((p, k) => { p.hidden = k !== S.step; });
  review.hidden = S.step !== REVIEW;
  if (S.step === REVIEW) renderReview();
  jump.value = String(S.step);
  const total = SECTIONS.length + 1;
  document.getElementById("barfill").style.width = ((S.step + 1) / total * 100) + "%";
  document.getElementById("stepLabel").textContent = S.step === REVIEW ? "Last step" : `Section ${S.step + 1} of ${SECTIONS.length}`;
  document.getElementById("navCount").textContent = `${S.step + 1} / ${total}`;
  back.disabled = S.step === 0;
  next.hidden = S.step === REVIEW;
  next.textContent = S.step === SECTIONS.length - 1 ? "Check and send" : "Next";
  updateMeta(); save();
  window.scrollTo({ top:0 });
}
back.addEventListener("click", () => go(S.step - 1));
next.addEventListener("click", () => go(S.step + 1));
go(S.step);
</script>
</body></html>
